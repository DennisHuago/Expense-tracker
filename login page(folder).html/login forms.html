<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="login forms.css" />
    <title>Login Page</title>
  </head>

  <body>
    <div id="main-container">
      <div id="sub-container">
        <p id="heading">EXPENSE TRACKER</p>

        <p id="heading1">Welcome back <span>👋</span></p>

        <div class="credentials-container">
          <label for="email" class="forms-label">Enter email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="input"
            placeholder="Elvina18@gmail.com"
          />
        </div>

        <div class="credentials-container">
          <label for="password" class="forms-label">Enter password</label>
          <input
            type="password"
            id="password"
            name="password"
            class="input"
            placeholder="Example00@"
          />
        </div>

        <div class="credentials-container">
          <button type="button" id="sign-in">Sign in</button>
        </div>

        <div class="credentials-container">
          <a href="password.html">Forgot password?</a>
        </div>

        <div class="credentials-container">
          <p id="no-account-message">Don't have an account?</p>
        </div>

        <div class="credentials-container">
          <a href="create-account.html">Sign up</a>
        </div>
      </div>
    </div>
  </body>
</html>
